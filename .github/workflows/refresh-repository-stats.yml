name: Refresh repository statistics

on:
  schedule:
    # Monday at 00:00 Asia/Shanghai (Sunday at 16:00 UTC).
    - cron: '0 16 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog-repository-statistics
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch public GitHub metadata and regenerate indexes
        id: refresh
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/catalog.py --refresh
      - name: Validate catalog
        run: |
          python3 scripts/catalog.py --check
          python3 -m unittest discover -s tests
          git diff --check
      - name: Commit refreshed snapshots and Markdown
        run: |
          git add data/repo-stats.json README.md README_zh.md resources/
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: refresh repository statistics'
          git push
      - name: Report incomplete refresh
        if: steps.refresh.outcome == 'failure'
        run: |
          echo 'Some repositories could not be refreshed. Previous snapshots were retained; see the fetch step.'
          exit 1
