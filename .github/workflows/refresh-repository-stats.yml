name: Refresh repository statistics

on:
  schedule:
    # Monday at 00:00 Asia/Shanghai (Sunday at 16:00 UTC).
    - cron: '0 16 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: catalog-repository-statistics
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch public GitHub metadata and regenerate indexes
        id: refresh
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/catalog.py --refresh
      - name: Refresh configured download sources
        id: downloads
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/download_stats.py
      - name: Refresh paper citations when snapshots are 30 days old
        id: papers
        continue-on-error: true
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python3 scripts/paper_stats.py
      - name: Refresh graph authors and organization owners when evidence is 30 days old
        id: graph
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/graph_sources.py --all
      - name: Validate catalog and graph
        run: |
          python3 scripts/catalog.py
          python3 scripts/catalog.py --check
          python3 scripts/export_site.py
          python3 -m unittest discover -s tests
          git diff --check
      - name: Commit refreshed snapshots and Markdown
        run: |
          git add data/repo-stats.json data/download-stats.json data/paper-stats.json data/graph-sources.json README.md README_zh.md resources/
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: refresh repository statistics'
          git push
      - name: Report incomplete refresh
        if: steps.refresh.outcome == 'failure' || steps.downloads.outcome == 'failure' || steps.papers.outcome == 'failure' || steps.graph.outcome == 'failure'
        run: |
          echo 'Some metrics could not be refreshed. Successful snapshots were retained; see the fetch steps.'
          exit 1
  website:
    needs: refresh
    if: always() && needs.refresh.result != 'cancelled'
    uses: ./.github/workflows/deploy-website.yml
    with:
      ref: ${{ github.ref }}
